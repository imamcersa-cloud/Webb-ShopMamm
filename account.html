<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Akun — Shop Mam</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/page.css">
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--green-ultra); }

    .auth-wrap {
      width:100%; max-width:420px;
      padding:24px;
    }

    .auth-card {
      background:var(--white);
      border-radius:20px;
      padding:36px;
      box-shadow:var(--shadow-hover);
      border:1.5px solid var(--green-pale);
    }

    .auth-logo {
      text-align:center; margin-bottom:28px;
    }
    .auth-logo span { font-size:42px; }
    .auth-logo h2 {
      font-family:'Playfair Display',serif;
      font-size:22px; font-weight:900;
      color:var(--green-dark); margin-top:8px;
    }
    .auth-logo h2 em { color:var(--green-main); }
    .auth-logo p { font-size:13px; color:var(--text-light); margin-top:4px; }

    .tabs {
      display:flex; background:var(--green-ultra);
      border-radius:var(--radius-sm);
      padding:4px; gap:4px; margin-bottom:24px;
    }
    .tab-btn {
      flex:1; padding:9px;
      background:none; border:none;
      font-family:inherit; font-size:13.5px; font-weight:600;
      color:var(--text-light); cursor:pointer; border-radius:8px;
      transition:var(--transition);
    }
    .tab-btn.active { background:var(--white); color:var(--green-dark); box-shadow:0 2px 8px rgba(0,0,0,.08); }

    .form-group { margin-bottom:16px; }
    .form-group label { display:block; font-size:12.5px; font-weight:600; color:var(--text-mid); margin-bottom:6px; }
    .form-group input {
      width:100%; padding:12px 16px;
      border:2px solid var(--green-pale);
      border-radius:var(--radius-sm);
      font-family:inherit; font-size:14px;
      color:var(--text-dark); outline:none;
      transition:var(--transition);
      background:var(--white);
    }
    .form-group input:focus { border-color:var(--green-main); background:#fff; }

    .submit-btn {
      width:100%; padding:13px;
      background:linear-gradient(135deg,var(--green-dark),var(--green-mid));
      color:var(--white); border:none;
      border-radius:var(--radius-sm);
      font-family:inherit; font-size:14.5px; font-weight:700;
      cursor:pointer; transition:var(--transition); margin-top:6px;
    }
    .submit-btn:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(27,67,50,.25); }

    .divider {
      display:flex; align-items:center; gap:12px;
      margin:18px 0; color:var(--text-light); font-size:12px;
    }
    .divider::before, .divider::after {
      content:''; flex:1; height:1px; background:var(--green-pale);
    }

    .social-btn {
      width:100%; padding:11px;
      background:var(--white); color:var(--text-dark);
      border:2px solid var(--green-pale);
      border-radius:var(--radius-sm);
      font-family:inherit; font-size:13.5px; font-weight:600;
      cursor:pointer; transition:var(--transition);
      display:flex; align-items:center; justify-content:center; gap:8px;
    }
    .social-btn:hover { border-color:var(--green-main); background:var(--green-ultra); }

    .forgot { text-align:right; margin-top:-8px; margin-bottom:16px; }
    .forgot a { font-size:12px; color:var(--green-main); text-decoration:none; font-weight:600; }

    .panel { display:none; }
    .panel.active { display:block; }
  </style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <span>🦜</span>
      <h2>Shop<em>mam</em></h2>
      <p>Masuk atau buat akun baru</p>
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('login',this)">Masuk</button>
      <button class="tab-btn" onclick="switchTab('register',this)">Daftar</button>
    </div>

    <!-- LOGIN -->
    <div class="panel active" id="panel-login">
      <div class="form-group">
        <label>Email / No. HP</label>
        <input type="text" placeholder="contoh@email.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" placeholder="Masukkan password">
      </div>
      <div class="forgot"><a href="#">Lupa password?</a></div>
      <button class="submit-btn" onclick="fakeLogin()">Masuk Sekarang</button>
      <div class="divider">atau masuk dengan</div>
      <button class="social-btn">📱 Lanjutkan dengan Google</button>
    </div>

    <!-- REGISTER -->
    <div class="panel" id="panel-register">
      <div class="form-group">
        <label>Nama Lengkap</label>
        <input type="text" placeholder="Nama kamu">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" placeholder="contoh@email.com">
      </div>
      <div class="form-group">
        <label>No. WhatsApp</label>
        <input type="tel" placeholder="08xxxxxxxxxx">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" placeholder="Minimal 8 karakter">
      </div>
      <button class="submit-btn" onclick="fakeRegister()">Buat Akun</button>
    </div>
  </div>
</div>

<script src="../js/products.js"></script>
<script>
function switchTab(id, el) {
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('panel-'+id).classList.add('active');
}

function fakeLogin()    { showToast('✅ Login berhasil! (demo)'); setTimeout(()=>goPage('pages/home.html','beranda'),1200); }
function fakeRegister() { showToast('✅ Akun dibuat! (demo)');    setTimeout(()=>goPage('pages/home.html','beranda'),1200); }
</script>
</body>
</html>
