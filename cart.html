<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keranjang — Shop Mam</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/page.css">
  <style>
    .page-header {
      background: linear-gradient(135deg,var(--green-dark),var(--green-mid));
      padding:28px 32px; color:var(--white);
    }
    .page-header h1 { font-family:'Playfair Display',serif; font-size:26px; font-weight:900; }
    .page-header h1 em { color:var(--accent); }

    .cart-layout { display:flex; gap:28px; padding:28px 32px 50px; align-items:flex-start; }

    /* ITEMS */
    .cart-items-col { flex:1; min-width:0; display:flex; flex-direction:column; gap:14px; }

    .cart-row {
      background:var(--white);
      border:1.5px solid var(--green-pale);
      border-radius:var(--radius);
      padding:16px;
      display:flex;
      align-items:center;
      gap:16px;
      animation: fadeUp .3s ease both;
    }
    .cart-row-img {
      width:80px; height:80px;
      border-radius:10px;
      object-fit:cover;
      background:var(--green-ultra);
      flex-shrink:0;
      display:flex; align-items:center; justify-content:center;
      font-size:32px;
    }
    .cart-row-img img { width:100%; height:100%; object-fit:cover; border-radius:10px; }
    .cart-row-info { flex:1; min-width:0; }
    .cart-row-name { font-size:14px; font-weight:700; color:var(--text-dark); margin-bottom:4px; }
    .cart-row-sub  { font-size:12px; color:var(--text-light); }
    .cart-row-price { font-size:16px; font-weight:700; color:var(--green-main); margin-top:6px; }

    .qty-control {
      display:flex; align-items:center; gap:10px;
    }
    .qty-btn {
      width:28px; height:28px;
      border-radius:50%;
      border:2px solid var(--green-pale);
      background:none;
      font-size:16px; font-weight:700;
      color:var(--green-dark);
      cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      transition:var(--transition);
    }
    .qty-btn:hover { background:var(--green-pale); }
    .qty-val { font-size:14px; font-weight:700; min-width:20px; text-align:center; }

    .remove-btn {
      background:none; border:none;
      color:#ccc; font-size:18px;
      cursor:pointer; transition:color .2s;
      padding:4px;
    }
    .remove-btn:hover { color:#e74c3c; }

    /* SUMMARY */
    .cart-summary {
      width:300px; flex-shrink:0;
      background:var(--white);
      border:1.5px solid var(--green-pale);
      border-radius:var(--radius);
      padding:22px;
      position:sticky; top:20px;
    }
    .cart-summary h3 {
      font-family:'Playfair Display',serif;
      font-size:18px; font-weight:700;
      color:var(--green-dark);
      margin-bottom:18px;
      padding-bottom:12px;
      border-bottom:1px solid var(--green-pale);
    }
    .summary-row {
      display:flex; justify-content:space-between;
      font-size:13.5px; color:var(--text-mid);
      margin-bottom:10px;
    }
    .summary-row.total {
      font-size:16px; font-weight:800;
      color:var(--text-dark);
      padding-top:12px;
      border-top:1px solid var(--green-pale);
      margin-top:6px;
    }
    .checkout-btn {
      width:100%; margin-top:16px;
      padding:13px;
      background:linear-gradient(135deg,var(--green-dark),var(--green-mid));
      color:var(--white);
      border:none; border-radius:var(--radius-sm);
      font-family:inherit; font-size:14.5px; font-weight:700;
      cursor:pointer; transition:var(--transition);
    }
    .checkout-btn:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(27,67,50,.25); }
    .checkout-btn:disabled { opacity:.5; cursor:not-allowed; transform:none; }

    .continue-btn {
      width:100%; margin-top:10px;
      padding:11px;
      background:none;
      color:var(--green-dark);
      border:2px solid var(--green-pale);
      border-radius:var(--radius-sm);
      font-family:inherit; font-size:13px; font-weight:600;
      cursor:pointer; transition:var(--transition);
    }
    .continue-btn:hover { border-color:var(--green-main); background:var(--green-ultra); }

    .empty-cart {
      text-align:center; padding:80px 20px;
    }
    .empty-cart .ec-icon { font-size:64px; margin-bottom:16px; }
    .empty-cart h3 { font-size:18px; color:var(--text-mid); margin-bottom:8px; }
    .empty-cart p  { font-size:13px; color:var(--text-light); margin-bottom:22px; }

    @media (max-width:700px) {
      .cart-layout { flex-direction:column; padding:16px; }
      .cart-summary { width:100%; position:static; }
    }
  </style>
</head>
<body>
<div class="page-header">
  <h1>🛒 Keranjang <em>Belanja</em></h1>
</div>

<div class="cart-layout">
  <div class="cart-items-col" id="cartItemsCol"></div>

  <div class="cart-summary">
    <h3>Ringkasan Pesanan</h3>
    <div class="summary-row"><span>Subtotal</span><span id="sumSubtotal">Rp 0</span></div>
    <div class="summary-row"><span>Ongkir</span><span style="color:var(--green-main)">Gratis</span></div>
    <div class="summary-row total"><span>Total</span><span id="sumTotal">Rp 0</span></div>
    <button class="checkout-btn" id="checkoutBtn" onclick="checkout()">Checkout via WhatsApp 💬</button>
    <button class="continue-btn" onclick="goPage('pages/home.html','beranda')">← Lanjut Belanja</button>
  </div>
</div>

<script src="../js/products.js"></script>
<script>
function renderCart() {
  const cart = getCart();
  const col = document.getElementById('cartItemsCol');
  const sub = document.getElementById('sumSubtotal');
  const tot = document.getElementById('sumTotal');
  const btn = document.getElementById('checkoutBtn');

  if (!cart.length) {
    col.innerHTML = `
      <div class="empty-cart">
        <div class="ec-icon">🪺</div>
        <h3>Keranjangmu masih kosong</h3>
        <p>Yuk mulai belanja dan temukan produk favorit kamu!</p>
        <button class="btn-primary" onclick="goPage('pages/home.html','beranda')">🛒 Mulai Belanja</button>
      </div>`;
    btn.disabled = true;
    sub.textContent = tot.textContent = 'Rp 0';
    return;
  }

  btn.disabled = false;

  // Group same products by id
  const grouped = {};
  cart.forEach((item, idx) => {
    if (!grouped[item.id]) grouped[item.id] = { ...item, qty: 0, indices: [] };
    grouped[item.id].qty++;
    grouped[item.id].indices.push(idx);
  });

  col.innerHTML = Object.values(grouped).map(item => `
    <div class="cart-row">
      <div class="cart-row-img">
        <img src="${item.img}" alt="${item.name}"
             onerror="this.parentElement.innerHTML='<span style=font-size:32px>${item.emoji}</span>'">
      </div>
      <div class="cart-row-info">
        <div class="cart-row-name">${item.name}</div>
        <div class="cart-row-sub">${item.sub}</div>
        <div class="cart-row-price">${rupiah(item.price * item.qty)}</div>
      </div>
      <div class="qty-control">
        <button class="qty-btn" onclick="changeQty(${item.id},-1)">−</button>
        <span class="qty-val">${item.qty}</span>
        <button class="qty-btn" onclick="changeQty(${item.id},+1)">+</button>
      </div>
      <button class="remove-btn" onclick="removeAll(${item.id})" title="Hapus">🗑️</button>
    </div>
  `).join('');

  const total = cart.reduce((s,i) => s + i.price, 0);
  sub.textContent = tot.textContent = rupiah(total);
}

function changeQty(id, delta) {
  const cart = getCart();
  if (delta === -1) {
    const idx = cart.findLastIndex(i => i.id === id);
    if (idx > -1) { cart.splice(idx, 1); saveCart(cart); renderCart(); }
  } else {
    const product = PRODUCTS.find(p => p.id === id);
    if (product) { cart.push({...product}); saveCart(cart); renderCart(); }
  }
}

function removeAll(id) {
  const cart = getCart().filter(i => i.id !== id);
  saveCart(cart);
  renderCart();
}

function checkout() {
  const cart = getCart();
  if (!cart.length) return;
  const total = cart.reduce((s,i) => s + i.price, 0);
  // Group for message
  const grouped = {};
  cart.forEach(i => { grouped[i.id] = grouped[i.id] || { name:i.name, price:i.price, qty:0 }; grouped[i.id].qty++; });
  const msg = 'Halo, saya ingin memesan:\n' +
    Object.values(grouped).map(i => `• ${i.name} x${i.qty} — ${rupiah(i.price * i.qty)}`).join('\n') +
    `\n\nTotal: ${rupiah(total)}`;
  // ⚠️ Ganti nomor WhatsApp di sini:
  window.open(`https://wa.me/6281234567890?text=${encodeURIComponent(msg)}`, '_blank');
}

renderCart();
</script>
</body>
</html>
